name: "일반 작업"
description: "기능 개발, 개선, 문서, 테스트 등의 작업을 등록합니다."
title: "[Feat] "
body:
  - type: markdown
    attributes:
      value: |
        ## Issue 작성 안내
        작업을 시작하기 전에 Issue를 등록해주세요.
        하나의 Issue에는 하나의 작업 목적만 작성합니다.

  - type: dropdown
    id: task_type
    attributes:
      label: "작업 유형"
      description: "작업 목적에 맞는 유형을 선택해주세요."
      options:
        - feat
        - refactor
        - docs
        - style
        - test
        - chore
        - design
        - comment
        - rename
        - remove
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "작업 개요"
      description: "어떤 작업을 진행할 예정인가요?"
      placeholder: "PDF 파일을 업로드하는 기능을 구현합니다."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "상세 작업 내용"
      description: "구체적인 작업을 체크리스트로 작성해주세요."
      placeholder: |
        - [ ] PDF 파일 업로드 기능 구현
        - [ ] 파일 형식 검증
        - [ ] 업로드 결과 처리
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: "완료 조건"
      description: "어떤 상태가 되면 작업이 완료된 것으로 판단하나요?"
      placeholder: |
        - PDF 파일이 정상적으로 업로드된다.
        - 지원하지 않는 파일은 오류 메시지를 표시한다.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "참고 자료"
      description: "관련 문서, 이미지, 참고 링크 등을 첨부해주세요."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Issue 작성 확인"
      options:
        - label: "기존 Issue와 중복되지 않는지 확인했습니다."
          required: true
        - label: "작업 내용과 완료 조건을 작성했습니다."
          required: true
