
name: "버그 수정"
description: "오류 및 긴급 수정 작업을 등록합니다."
title: "[Fix] "
body:
  - type: dropdown
    id: task_type
    attributes:
      label: "작업 유형"
      options:
        - fix
        - hotfix
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "오류 내용"
      description: "현재 어떤 문제가 발생하고 있나요?"
      placeholder: "PDF 업로드 시 일부 파일에서 오류가 발생합니다."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "오류 재현 방법"
      description: "문제가 발생하는 과정을 순서대로 작성해주세요."
      placeholder: |
        1. PDF 파일을 선택한다.
        2. 업로드 버튼을 클릭한다.
        3. 오류 메시지가 발생한다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "기대 결과"
      description: "정상적으로 동작한다면 어떤 결과가 나와야 하나요?"
      placeholder: "PDF가 정상적으로 업로드되고 분석 결과가 표시되어야 합니다."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "수정 작업 및 완료 조건"
      placeholder: |
        - [ ] 오류 원인 확인
        - [ ] 오류 수정
        - [ ] 동일 오류 재발 여부 테스트
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "실행 환경 및 참고 자료"
      description: "OS, Python 버전, 오류 로그, 스크린샷 등을 작성해주세요."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Issue 작성 확인"
      options:
        - label: "기존 Issue와 중복되지 않는지 확인했습니다."
          required: true
        - label: "오류 내용과 재현 방법을 작성했습니다."
          required: true
