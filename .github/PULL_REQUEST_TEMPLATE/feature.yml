name: ✨ 기능 개발 (Feature)
description: 새로운 기능을 추가할 때 사용하는 PR 템플릿입니다.
body:
  - type: textarea
    id: what
    attributes:
      label: 🛠️ 작업 내용
      description: 이번 PR에서 구현한 핵심 내용을 설명해주세요.
      placeholder: 예: 로그인 API에 JWT 인증 적용
    validations:
      required: true

  - type: input
    id: issue_number
    attributes:
      label: 🔗 관련 이슈
      description: 해결된 이슈 번호를 적어주세요. (예: #42)
      placeholder: "#이슈번호"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 🔍 변경 이유 및 배경
      description: 이 작업을 하게 된 이유를 적어주세요.
      placeholder: 예: 세션 방식에서 토큰 방식으로 전환 필요
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: ☑️ PR 체크리스트
      options:
        - label: 코드가 정상적으로 빌드되며, 테스트를 통과했습니다.
          required: true
        - label: 불필요한 콘솔 로그나 주석을 제거했습니다.
          required: true