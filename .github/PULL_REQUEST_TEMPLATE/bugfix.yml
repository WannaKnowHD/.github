name: 🐛 버그 수정 (Bugfix)
description: 기존 기능의 버그를 수정할 때 사용하는 PR 템플릿입니다.
body:
  - type: input
    id: issue_number
    attributes:
      label: 🔗 관련 이슈
      description: 해결된 이슈 번호를 적어주세요. (예: #42)
      placeholder: "#이슈번호"
    validations:
      required: false

  - type: textarea
    id: cause
    attributes:
      label: 🔍 버그 원인
      description: 어떤 이유로 발생한 버그였나요?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 수정 방법
      description: 문제를 어떻게 해결했는지 설명해주세요.
    validations:
      required: true